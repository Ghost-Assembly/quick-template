name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1
      - run: npm ci --ignore-scripts
      - run: just ci
  security:
    name: security
    uses: $/.github/workflows/security.yml
    permissions:
      contents: read
      actions: read # Inspect workflow runs and download their tested artifacts.
      security-events: write # Upload CodeQL findings to GitHub code scanning.
  sonar:
    name: sonar
    uses: $/.github/workflows/sonar.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  ci:
    name: ci
    if: always()
    needs: [checks, security, sonar]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          CHECKS: ${{ needs.checks.result }}
          SECURITY: ${{ needs.security.result }}
          SONAR: ${{ needs.sonar.result }}
        run: test "$CHECKS" = success && test "$SECURITY" = success && test "$SONAR" = success
